name: Release
# Déclenché par un tag de version (ex. v0.2.0). Publie le CSS des tokens comme artefact de la release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier (build, lint, contrastes)
        run: npm test
      - name: Générer tokens.css
        run: npm run build
      - name: Créer la release et joindre tokens.css
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" tokens/dist/tokens.css \
            --title "VYNT UI $GITHUB_REF_NAME" \
            --generate-notes
